  <script>
    const content=document.getElementById('content'),title=document.getElementById('title'),shell=document.getElementById('shell');let view='overview',state='normal';
    const overview=()=>`<div class="intro"><div><h2>오늘의 운영 현황</h2><p>긴급 상담과 현재 이용 학생을 먼저 확인합니다.</p></div><b>2026.10.12 · 오늘</b></div>${state==='error'?'<div class="error">서버와 다시 연결하고 있습니다. 마지막 갱신 1분 전</div><br>':''}<div class="grid"><section class="card"><h3>즉시 확인이 필요한 상담</h3>${state==='empty'?'<div class="empty">지금 확인할 상담이 없습니다.</div>':'<div class="alert-row"><i class="alert-dot"></i><span><b>김서연 · 1학년 1반</b><small>바로 어른의 도움이 필요해요.</small></span><button class="link">상세 확인 →</button></div><div class="alert-row"><i class="alert-dot amber"></i><span><b>박도윤 · 1학년 1반</b><small>먼저 확인이 필요합니다.</small></span><button class="link">상세 확인 →</button></div>'}</section><section class="card"><h3>현재 이용 학생</h3>${state==='empty'?'<div class="empty">현재 이용 중인 학생이 없습니다.</div>':'<div class="student-row"><b>김서연</b><span>13:15</span><span class="mood-chip">☁️ 구름 가득</span></div><div class="student-row"><b>박도윤</b><span>13:15</span><span class="mood-chip">🌧️ 거센 비</span></div>'}</section><div class="metrics"><div class="metric"><span>현재 이용</span><strong>${state==='empty'?0:2}명</strong></div><div class="metric"><span>오늘 방문</span><strong>${state==='empty'?0:3}명</strong></div><div class="metric"><span>퇴실 완료</span><strong>${state==='empty'?0:1}명</strong></div><div class="metric"><span>마음 날씨</span><strong>${state==='empty'?0:3}건</strong></div></div><div class="charts"><section class="card"><h3>오늘 마음 날씨</h3><div class="bar-row"><span>☀️ 햇살 가득</span><div class="track"><i style="width:70%"></i></div><b>6</b></div><div class="bar-row"><span>☁️ 구름 가득</span><div class="track"><i style="width:30%"></i></div><b>2</b></div><div class="bar-row"><span>🌧️ 거센 비</span><div class="track"><i style="width:14%"></i></div><b>1</b></div></section><section class="card"><h3>학년별 방문</h3><div class="bar-row"><span>1학년</span><div class="track"><i style="width:80%"></i></div><b>8</b></div><div class="bar-row"><span>2학년</span><div class="track"><i style="width:50%"></i></div><b>5</b></div><div class="bar-row"><span>3학년</span><div class="track"><i style="width:20%"></i></div><b>2</b></div></section></div></div>`;
    const counseling=()=>`<div class="intro"><div><h2>상담 신청 관리</h2><p>위험 응답을 숨기지 않고 우선순위대로 확인합니다.</p></div><b>미확인 2건</b></div><div class="split"><div class="list"><div class="filters"><button>미확인 2</button><button>긴급 1</button><button>우선 1</button></div><button class="request active">🔴 <b>김서연</b><br><small>바로 도움 필요 · 13:15</small></button><button class="request">🟠 <b>박도윤</b><br><small>먼저 확인 필요 · 13:15</small></button></div><article class="detail"><span class="badge">지금 확인 필요</span><h2>김서연</h2><p>1학년 1반 · 2026.10.12 13:15</p><hr><h3>고민 주제</h3><p>마음·기분</p><h3>보호자 연락처</h3><p>엄마 · 010-0000-0000</p><h3>안전 확인 답변</h3><div class="answer"><span>바로 어른의 도움이 필요한가요?</span><b class="yes">네 ●</b></div><div class="answer"><span>자신을 다치게 하고 싶은 생각이 있나요?</span><b>아니요</b></div><div class="answer"><span>학교나 집에서 안전하지 않나요?</span><b>아니요</b></div><p style="text-align:right"><button class="primary">학생 확인 후 완료로 표시</button></p></article></div>`;
    const operations=()=>`<div class="intro"><div><h2>운영 상태와 학생 접속</h2><p>현재 안내 상태, 자동 시간표, 학생 접속 주소를 관리합니다.</p></div></div>${state==='error'?'<div class="error">학생 접속 주소를 만들지 못했습니다. 네트워크를 확인해 주세요.</div><br>':''}<div class="grid"><section class="card"><h3>현재 운영 상태</h3><div class="mode-grid">${['개방','닫힘','회의 중','상담 중','수업 중','출장 중','식사 중','부재 중'].map((x,i)=>`<button class="mode ${i===0?'active':''}"><b>${x}</b><small>${i===0?'학생 화면을 이용할 수 있습니다.':'학생에게 상태 안내를 표시합니다.'}</small></button>`).join('')}</div></section><section class="card"><h3>학생 접속</h3>${state==='empty'?'<div class="empty">학생 접속이 중지되어 있습니다.<br><button class="primary">학생 접속 시작</button></div>':`<div class="access"><div class="qr">QR 미리보기</div><div><span class="badge" style="color:#176d53;background:#e9f7f1">● 온라인</span><h3 style="margin-top:12px">https://student.example/wee</h3><p>오늘 오후 6시까지 유효</p><div class="actions"><button class="primary">학생 화면 열기</button><button class="secondary">주소 복사</button></div></div></div>`}</section><section class="card" style="grid-column:1/-1"><h3>개방 방식 · 주간 시간표</h3><div class="tabs"><button class="active">수동 개방</button><button>요일별 시간표</button></div><p>상단 운영 상태에서 개방 여부를 직접 바꿉니다. 저장 완료 후에만 적용됩니다.</p></section></div>`;
    const students=()=>`<div class="intro"><div><h2>학교와 학생 명렬표</h2><p>학교 정보 저장과 명렬표 전체 교체를 분리해 관리합니다.</p></div></div><div class="tabs"><button class="active">학교 정보</button><button>학생 명렬표</button></div><section class="card"><h3>학교 정보</h3><div class="grid"><label class="field">학교급<select><option>초등학교</option></select></label><label class="field">학교 이름<input value="○○초등학교"></label></div><p style="color:var(--muted)">학교급을 바꿔도 기존 명렬표 데이터는 보존됩니다.</p><p style="text-align:right"><button class="primary">학교 정보 저장</button></p></section><br><section class="card"><h3>학생 명렬표 전체 교체 · 현재 48명</h3><textarea style="width:100%;min-height:110px">학년&#9;반&#9;이름\n1&#9;1&#9;김서연\n1&#9;1&#9;박도윤</textarea><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="secondary">현재 명렬표 불러오기</button><button class="primary">미리보기</button></div></section>`;
    const system=()=>`<div class="intro"><div><h2>백업과 학년도 관리</h2><p>암호화 백업을 확인하고 위험 작업을 분리해 관리합니다.</p></div><button class="primary">지금 백업</button></div><section class="card"><h3>최근 백업 2개</h3>${state==='empty'?'<div class="empty">저장된 백업이 없습니다.</div>':'<div class="backup">▣ <span><b>wee-check-2026-10-12.db.enc</b><small>이 관리자 PC에 암호화 저장됨</small></span><button class="secondary">복원</button></div><div class="backup">▣ <span><b>wee-check-2026-10-05.db.enc</b><small>이 관리자 PC에 암호화 저장됨</small></span><button class="secondary">복원</button></div>'}</section><section class="card danger"><h3>⚠ 학년도 마감</h3><p>백업을 만든 뒤 출입·상담 기록과 현재 명렬표를 비웁니다.</p><button class="primary" style="background:var(--red)">학년도 마감</button></section>`;
    function render(){title.textContent=({overview:'대시보드',counseling:'상담 관리',operations:'운영·학생 접속',students:'학생·명렬표',system:'백업·학년도'})[view];content.innerHTML=view==='overview'?overview():view==='counseling'?counseling():view==='operations'?operations():view==='students'?students():system();}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===button));render()}));document.querySelectorAll('[data-state]').forEach(button=>button.addEventListener('click',()=>{state=button.dataset.state;render()}));document.getElementById('sideToggle').addEventListener('click',event=>{shell.classList.toggle('side-expanded');const open=shell.classList.contains('side-expanded');event.currentTarget.setAttribute('aria-expanded',open);event.currentTarget.setAttribute('aria-label',open?'사이드바 접기':'사이드바 펼치기')});document.getElementById('device').addEventListener('click',event=>{shell.classList.toggle('mobile');event.currentTarget.textContent=shell.classList.contains('mobile')?'데스크톱 보기':'모바일 보기'});render();
  </script>
